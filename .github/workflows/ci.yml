# Intégration continue — garde-fou du flux dev -> staging -> main.
#
# Elle tourne sur les Pull Requests vers `dev` (le vrai verrou : `dev` ne reçoit
# que du vert) et sur les push des trois branches longues, pour que chaque commit
# promu porte déjà son état de contrôle.
#
# Ce qui N'EST PAS ici : `scripts/valider-cartes.mjs`. Il lit `data/cartes/`, qui
# est volontairement hors dépôt (contenu Goblivion Games). GitHub n'a pas ces
# fichiers et ne les aura jamais : cette validation reste un garde-fou local,
# à jouer avant de pousser.

name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev]

# Une seule exécution par branche : un push qui en suit un autre annule le premier.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Java 21 : le pom cible volontairement le 21 (LTS), même si la machine de
      # développement tourne sur un JDK plus récent.
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tests
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation
        run: npm ci

      - name: Tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
