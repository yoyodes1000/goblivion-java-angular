<app-bandeau-phase [phase]="phase()" (changementDemande)="changerPhase($event)" />

<main class="plateau__corps" [attr.data-phase]="phase()">
  <div class="plateau__gauche">
    <app-compteur-ressources [ressources]="ressources()" (ajustementDemande)="ajusterRessources($event)" />
    <app-entrainement-en-cours [carte]="entrainementChoisi()" (marcheDemande)="marcheOuvert.set(true)" />
  </div>

  <app-pile-monstres class="plateau__pile" [nombre]="taillePile" />
  <app-plateau-avancee class="plateau__avancee" />
  <app-portes-chateau class="plateau__portes" />

  <app-zone-jeu class="plateau__zone" [phase]="phase()" />
  <app-cartes-royales class="plateau__royales" [roiReine]="roiReine()" [gardeDuCorps]="gardeDuCorps()" />
  <app-chateau-hopital class="plateau__chateau" [nombreChateau]="nombreChateau" [cartes]="cartesHopital()" />
</main>

@if (marcheOuvert()) {
  <app-cartes-dorees
    [offres]="offres()"
    [combatGagne]="combatGagne()"
    (entrainementDemande)="choisirEntrainement($event)"
    (combatGagneBascule)="combatGagne.set($event)"
    (fermeture)="marcheOuvert.set(false)"
  />
}
